name: CD
on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

jobs:
  release:
    name: Release
    if: ${{ github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Verify Version Status
        id: verify-version-status
        shell: bash
        run: |
          source ./src/constants.sh

          if git tag | grep "${__BX_CONSTANiT_VERSION__}"; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate dist
        if: steps.verify-version-status.outputs.released == 'false'
        shell: bash
        run: ./bin/bx dist
