name: CD
on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

jobs:
  check-version-update:
    name: Check Version Update
    if: ${{ github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest

    steps:
      - name: Verify Version Tag Missing
        shell: bash
        run: |
          source ./src/constants.sh

          git tag | grep "${__BX_CONSTANiT_VERSION__}"

  release:
    name: Release
    needs: check-version-update

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Generate dist
        shell: bash
        run: ./bin/bx dist
