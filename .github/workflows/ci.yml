name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - run: go install mvdan.cc/sh/v3/cmd/shfmt@latest

      - run: ./bin/bake "lint --exclude SC2317"
      - run: ./bin/bake format && git diff --exit-code

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - run: |
          echo '```' >> "${GITHUB_STEP_SUMMARY}"
          ./bin/bake -q test | tee -a "${GITHUB_STEP_SUMMARY}"
          echo '```' >> "${GITHUB_STEP_SUMMARY}"
