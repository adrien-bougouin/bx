name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  check-style:
    name: Check Style
    runs-on: ubuntu-latest
    env:
      SHFMT_VERSION: "3.13.1"

    steps:
      - uses: actions/checkout@v6

      - name: Cache shfmt
        id: cache-shfmt
        uses: actions/cache@v6
        with:
          path: ~/.local/bin
          key: shfmt-${{ runner.os }}-${{ env.SHFMT_VERSION }}
      - name: Install shfmt
        if: steps.cache-shfmt.outputs.cache-hit != 'true'
        run: |
          mkdir -p ${HOME}/.local/bin
          curl -fsSL -o ${HOME}/.local/bin/shfmt \
            "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_amd64"
          chmod +x ${HOME}/.local/bin/shfmt
      - name: Add shfmt to PATH
        run: echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - uses: ruby/setup-ruby@v1
        env:
          BUNDLE_GEMFILE: "./features/Gemfile"
        with:
          ruby-version: '4.0.5'
          bundler-cache: true

      - run: ./bin/bx format && git diff --exit-code
      - run: ./bin/bx "lint --exclude SC2317,SC2015"
      - run: ./bin/bx features::lint

  check-features:
    name: Check Features

    strategy:
      matrix:
        os: ['ubuntu-latest', 'macos-latest']

    runs-on: ${{matrix.os}}

    steps:
      - uses: actions/checkout@v6

      - uses: ruby/setup-ruby@v1
        env:
          BUNDLE_GEMFILE: "./features/Gemfile"
        with:
          ruby-version: '4.0.5'
          bundler-cache: true

      - name: Tests run
        shell: bash
        run: |
          ./bin/bx "features::check --tags 'not @skip:${{ vars.MAX_SKIPS }}'"

  release:
    name: Release
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [ check-style, check-features ]

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Verify Version Status
        id: verify-version-status
        shell: bash
        run: |
          source ./src/constants.sh

          if git tag | grep "v${__BX_CONSTANT_VERSION__}"; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate Dist
        if: steps.verify-version-status.outputs.released == 'false'
        shell: bash
        run: |
          source ./src/constants.sh

          REPO_URL="${{ github.server_url }}/${{ github.repository }}"

          ./bin/bx "dist ${REPO_URL}/releases/download/v${__BX_CONSTANT_VERSION__}/install.sh"

      - name: Create GitHub Release
        if: steps.verify-version-status.outputs.released == 'false'
        shell: bash
        run: |
          source ./src/constants.sh

          gh release create "v${__BX_CONSTANT_VERSION__}" \
            --title "v${__BX_CONSTANT_VERSION__}" \
            --generate-notes \
            dist/*
