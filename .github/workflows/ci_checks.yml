name: CI Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  style-check:
    name: Style Check
    runs-on: ubuntu-latest
    env:
      SHFMT_VERSION: "3.13.1"

    steps:
      - uses: actions/checkout@v6

      - name: Cache shfmt
        id: cache-shfmt
        uses: actions/cache@v6
        with:
          path: ~/.local/bin
          key: shfmt-${{ runner.os }}-${{ env.SHFMT_VERSION }}
      - name: Install shfmt
        if: steps.cache-shfmt.outputs.cache-hit != 'true'
        run: |
          mkdir -p ${HOME}/.local/bin
          curl -fsSL -o ${HOME}/.local/bin/shfmt \
            "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_amd64"
          chmod +x ${HOME}/.local/bin/shfmt
      - name: Add shfmt to PATH
        run: echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - uses: ruby/setup-ruby@v1
        env:
          BUNDLE_GEMFILE: "./features/Gemfile"
        with:
          ruby-version: '4.0.5'
          bundler-cache: true

      - run: ./bin/bake format && git diff --exit-code
      - run: ./bin/bake "lint --exclude SC2317,SC2015"
      - run: ./bin/bake cucumber-lint

  features-check:
    name: Features Check

    strategy:
      matrix:
        os: ['ubuntu-latest', 'macos-latest']
        bash-version: ['3.2', '4.4', '5.0', '5.1', '5.2']

    runs-on: ${{matrix.os}}
    container: ${{ matrix.os == 'ubuntu-latest' && 'bash:${{matrix.bash-version}}' || null}}

    steps:
      - uses: actions/checkout@v6

      - uses: ruby/setup-ruby@v1
        env:
          BUNDLE_GEMFILE: "./features/Gemfile"
        with:
          ruby-version: '4.0.5'
          bundler-cache: true

      - name: Tests run
        id: tests-run
        run: |
          ./bin/bake "features-check --tags 'not @skip:${{ vars.MAX_SKIPS }}'"
